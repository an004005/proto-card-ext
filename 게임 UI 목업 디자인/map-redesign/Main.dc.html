<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap');
    :root {
      --color-bg: #f3f2f2; --color-surface: #eae9e9; --color-text: #201e1d;
      --color-accent: #ec3013; --color-accent-2: #e15b47; --color-divider: rgba(32,30,29,0.4);
      --color-neutral-100: #f8f4f4; --color-neutral-200: #eae7e7; --color-neutral-300: #d7d3d3;
      --color-neutral-400: #bab6b6; --color-neutral-500: #9b9797; --color-neutral-600: #7d7979;
      --color-neutral-700: #605d5d; --color-neutral-800: #444141; --color-neutral-900: #2d2b2b;
      --color-accent-100: #fff2ef; --color-accent-600: #dd2b0f; --color-accent-700: #ae1800;
      --color-accent-2-100: #fff2ef; --color-accent-2-300: #ffc4b9; --color-accent-2-600: #c94b39; --color-accent-2-700: #9e3526;
      --shadow-sm: 0 1px 2px rgba(45,43,43,.14); --shadow-md: 0 3px 10px rgba(45,43,43,.16); --shadow-lg: 0 12px 32px rgba(45,43,43,.22);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--color-accent); } a:hover { color: var(--color-accent-2-700); }
    #app {
      width: 1440px; height: 900px; background: var(--color-bg); color: var(--color-text);
      font-family: "Archivo", system-ui, sans-serif; font-size: 13px; line-height: 1.4;
      display: flex; flex-direction: column; overflow: hidden; position: relative; user-select: none;
    }
    button { font: inherit; cursor: pointer; }
    svg text { font-family: "Archivo", system-ui, sans-serif; }

    /* ---------- HUD ---------- */
    #hud {
      flex: 0 0 60px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; border-bottom: 2px solid var(--color-divider); background: var(--color-bg); z-index: 20;
    }
    #hud h1 { font-size: 18px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
    #hud .stats { display: flex; align-items: center; gap: 4px; }
    .stat-chip { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-right: 1px solid var(--color-divider); }
    .stat-chip:last-child { border-right: none; }
    .stat-chip svg { flex: none; opacity: .75; }
    .stat-chip .lbl { font-size: 10px; color: var(--color-neutral-600); letter-spacing: .02em; }
    .stat-chip .val { font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
    .stat-chip .val.warn { color: var(--color-accent-600); }
    .mini-bar { width: 54px; height: 6px; background: var(--color-neutral-200); position: relative; }
    .mini-bar i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--color-accent-2-700); }
    .mini-bar .floor { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--color-neutral-900); }
    #hud .actions { display: flex; align-items: center; gap: 6px; }
    .icon-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--color-divider); background: transparent; position: relative; }
    .icon-btn:hover { background: rgba(32,30,29,.06); }
    .icon-btn.on { background: var(--color-accent); border-color: var(--color-accent); }
    .icon-btn.on svg { stroke: var(--color-bg); }
    .icon-btn .dot { position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--color-accent); border: 1.5px solid var(--color-bg); }
    .btn { font-family: inherit; font-weight: 800; font-size: 12px; padding: 8px 14px; border: 1px solid var(--color-divider); background: transparent; color: var(--color-text); }
    .btn:hover { background: rgba(32,30,29,.06); }
    .btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-bg); }
    .btn.primary:hover { background: var(--color-accent-600); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn:disabled:hover { background: transparent; }

    /* ---------- body split ---------- */
    #body { flex: 1; display: flex; min-height: 0; position: relative; }
    #mapWrap { flex: 1; position: relative; background: var(--color-bg); overflow: hidden; cursor: grab; }
    #mapWrap.dragging { cursor: grabbing; }
    #mapSvg { width: 100%; height: 100%; display: block; }

    #mapControls { position: absolute; top: 14px; right: 14px; display: flex; flex-direction: column; gap: 4px; z-index: 5; }
    #mapControls .icon-btn { background: var(--color-bg); box-shadow: var(--shadow-sm); }

    #minimapWrap {
      position: absolute; left: 14px; bottom: 14px; width: 190px; height: 190px;
      background: var(--color-bg); border: 1px solid var(--color-divider); box-shadow: var(--shadow-md); z-index: 5;
    }
    #minimapWrap svg { width: 100%; height: 100%; display: block; cursor: pointer; }
    #minimapWrap .cap { position: absolute; top: 6px; left: 8px; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-neutral-600); font-weight: 800; }

    #legendPop {
      position: absolute; top: 56px; right: 14px; width: 260px; background: var(--color-bg);
      border: 1px solid var(--color-divider); box-shadow: var(--shadow-lg); padding: 12px 14px; z-index: 30; display: none;
    }
    #legendPop.open { display: block; }
    #legendPop h5 { margin: 0 0 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-neutral-700); }
    .legend-row { display: flex; align-items: center; gap: 8px; font-size: 11px; padding: 3px 0; }
    .legend-glyph { width: 16px; height: 16px; flex: none; display: flex; align-items: center; justify-content: center; }

    #toast {
      position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(8px); opacity: 0;
      background: var(--color-neutral-900); color: var(--color-bg); font-size: 12px; font-weight: 600;
      padding: 8px 16px; box-shadow: var(--shadow-lg); z-index: 40; pointer-events: none; transition: opacity .15s ease, transform .15s ease; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ---------- side panel ---------- */
    #panel {
      flex: 0 0 340px; border-left: 2px solid var(--color-divider); background: var(--color-bg);
      display: flex; flex-direction: column; overflow-y: auto; z-index: 10;
    }
    .panel-sec { padding: 14px 18px; border-bottom: 1px solid var(--color-divider); }
    .panel-sec h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-neutral-700); font-weight: 800; }
    .sector-head { display: flex; align-items: baseline; justify-content: space-between; }
    .sector-head .name { font-size: 17px; font-weight: 800; }
    .alert-dots { display: flex; gap: 3px; align-items: center; }
    .alert-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--color-neutral-300); }
    .alert-dots i.on { background: var(--color-accent-600); }
    .exit-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .exit-chip { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 4px 9px; border: 1px solid var(--color-divider); }
    .exit-chip.open { border-color: var(--color-accent); color: var(--color-accent-700); background: var(--color-accent-100); }

    .cap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .cap-chip { border: 1px solid var(--color-divider); padding: 6px 9px; cursor: pointer; }
    .cap-chip:hover { background: rgba(32,30,29,.05); }
    .cap-chip .top { display: flex; justify-content: space-between; align-items: center; }
    .cap-chip .k { font-size: 10px; letter-spacing: .04em; color: var(--color-neutral-600); font-weight: 800; }
    .cap-chip .v { font-size: 15px; font-weight: 800; }
    .cap-chip .desc { font-size: 10.5px; color: var(--color-neutral-700); margin-top: 6px; line-height: 1.5; display: none; }
    .cap-chip.expanded .desc { display: block; }
    .cap-chip.expanded { grid-column: 1 / -1; }

    #inspector { min-height: 220px; }
    .insp-empty { font-size: 12px; color: var(--color-neutral-600); padding: 6px 0; }
    .insp-title { font-size: 15px; font-weight: 800; margin-bottom: 2px; }
    .insp-sub { font-size: 11px; color: var(--color-neutral-600); margin-bottom: 10px; }
    .know-badge { display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 7px; border: 1px solid currentColor; margin-bottom: 8px; }
    .stale-note { font-size: 10.5px; color: var(--color-neutral-600); font-style: italic; margin-bottom: 8px; }
    .action-group { margin-top: 12px; }
    .action-group .label { font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 6px; }
    .action-btn { width: 100%; text-align: left; border: 1px solid var(--color-divider); background: transparent; padding: 8px 10px; margin-bottom: 6px; display: block; }
    .action-btn:hover:not(:disabled) { background: rgba(32,30,29,.05); border-color: var(--color-text); }
    .action-btn:disabled { opacity: .4; cursor: not-allowed; }
    .action-btn .t { font-weight: 800; font-size: 12px; display: flex; justify-content: space-between; }
    .action-btn .preview { font-size: 10.5px; color: var(--color-neutral-600); margin-top: 3px; font-variant-numeric: tabular-nums; }
    .action-btn.primary { background: var(--color-accent-100); border-color: var(--color-accent); }
    .action-btn.danger-flow { border-color: var(--color-accent-2-700); }
    .lock-note { font-size: 10.5px; color: var(--color-accent-2-700); margin-top: 3px; }
    .threat-flow { border: 1px solid var(--color-accent-600); padding: 10px; margin-top: 10px; background: var(--color-accent-100); }
    .threat-flow .h { font-weight: 800; font-size: 11.5px; color: var(--color-accent-700); margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }

    #confirmModal {
      position: absolute; inset: 0; background: rgba(32,30,29,.5); display: none; align-items: center; justify-content: center; z-index: 50;
    }
    #confirmModal.open { display: flex; }
    #confirmModal .box { width: 360px; background: var(--color-bg); border: 2px solid var(--color-text); padding: 20px; box-shadow: var(--shadow-lg); }
    #confirmModal h4 { margin: 0 0 8px; font-size: 15px; font-weight: 800; }
    #confirmModal p { font-size: 12px; color: var(--color-neutral-700); margin: 0 0 16px; line-height: 1.6; }
    #confirmModal .row { display: flex; gap: 8px; justify-content: flex-end; }

    /* ---------- log drawer ---------- */
    #logDrawer {
      position: absolute; left: 0; right: 340px; bottom: 0; height: 220px; background: var(--color-bg);
      border-top: 2px solid var(--color-divider); box-shadow: var(--shadow-lg); z-index: 25;
      transform: translateY(100%); transition: transform .18s ease; display: flex; flex-direction: column;
    }
    #logDrawer.open { transform: translateY(0); }
    #logDrawer .hd { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--color-divider); }
    #logDrawer .hd .tag { font-size: 10px; font-weight: 800; border: 1px solid var(--color-accent); color: var(--color-accent); padding: 2px 8px; }
    #logDrawer .body { flex: 1; overflow-y: auto; padding: 8px 16px; font-family: ui-monospace, monospace; font-size: 11px; color: var(--color-neutral-700); line-height: 1.9; }

    .glow { animation: pulse-ring 1.8s ease-out infinite; }
    @keyframes pulse-ring { 0% { opacity: .55; r: 11; } 70% { opacity: 0; r: 22; } 100% { opacity: 0; r: 22; } }
    @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
  </style>
</helmet>

<div id="app">

    <h1>시설맵</h1>
    <div class="stats" id="hudStats"></div>

<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    const NS = 'http://www.w3.org/2000/svg';
    const root = this._root = document.getElementById('app');
    if (!root) return;

    /* ---------------- deterministic RNG ---------------- */
    let seed = 42;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return (seed % 100000) / 100000; };

    /* ---------------- icon library ---------------- */
    const ICON = {
      heart: '<path d="M10 17s-6.2-3.9-6.2-8.5A3.8 3.8 0 0 1 10 6.1a3.8 3.8 0 0 1 6.2 2.4C16.2 13.1 10 17 10 17z"/>',
      clock: '<circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/>',
      box: '<path d="M3 6.5 10 3l7 3.5-7 3.5-7-3.5Z"/><path d="M3 6.5V14l7 3.5 7-3.5V6.5"/><path d="M10 10v7.5"/>',
      bolt: '<path d="M11 2 4 11h5l-1 7 7-9h-5l1-7Z"/>',
      search: '<circle cx="8.5" cy="8.5" r="5.5"/><path d="m17 17-4-4"/>',
      list: '<path d="M4 5h12M4 10h12M4 15h8"/>',
      plus: '<path d="M10 4v12M4 10h12"/>',
      minus: '<path d="M4 10h12"/>',
      target: '<circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="2.4"/><path d="M10 2v3M10 15v3M2 10h3M15 10h3"/>',
      shield: '<path d="M10 2.5 16 5v5c0 4-2.6 6.6-6 7.5-3.4-.9-6-3.5-6-7.5V5l6-2.5Z"/>',
      warn: '<path d="M10 3 2 17h16L10 3Z"/><path d="M10 8.3v3.4M10 14.3h.01"/>',
      diamond: '<path d="M10 2 17 10 10 18 3 10 10 2Z"/>',
      key: '<circle cx="6" cy="10" r="3.2"/><path d="M8.8 10H17M13.5 10v3M16 10v2.5"/>',
      leaf: '<path d="M4 16C4 8 10 4 17 3c1 7-3 13-11 13H4Z"/><path d="M4 16c2-4 5-6.5 9-8"/>',
      eye: '<path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10Z"/><circle cx="10" cy="10" r="2.3"/>',
    };
    const svgIcon = (name, size, stroke) => `<svg width="${size||16}" height="${size||16}" viewBox="0 0 20 20" fill="none" stroke="${stroke||'currentColor'}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON[name]||''}</svg>`;

    /* ---------------- data model: sectors, nodes, edges ---------------- */
    const SECTORS = [
      { id: 'entrance', name: '입구·관리동' },
      { id: 'labs', name: '실험동' },
      { id: 'hangar', name: '격납고·물류창고' },
      { id: 'security', name: '보안·격리동' },
      { id: 'power', name: '동력·정비동' },
      { id: 'waste', name: '폐기물 처리장' },
      { id: 'comms', name: '통신·관제탑' },
      { id: 'residential', name: '거주동' },
    ];
    const CENTER = { x: 600, y: 600 };
    const RING_R = 380, SECTOR_R = 148, PER_SECTOR = 20;
    SECTORS.forEach((s, i) => {
      const a = -Math.PI / 2 + i * (Math.PI * 2 / SECTORS.length);
      s.cx = CENTER.x + RING_R * Math.cos(a);
      s.cy = CENTER.y + RING_R * Math.sin(a);
      s.angle = a;
      s.alert = [1, 2, 0, 1, 3, 1, 0, 0][i];
    });
    const sectorById = Object.fromEntries(SECTORS.map((s) => [s.id, s]));

    const nodes = [];
    SECTORS.forEach((s) => {
      for (let j = 0; j < PER_SECTOR; j++) {
        const r = SECTOR_R * Math.sqrt(rnd());
        const th = rnd() * Math.PI * 2;
        nodes.push({
          id: `${s.id}_${j}`, sectorId: s.id,
          x: s.cx + r * Math.cos(th), y: s.cy + r * Math.sin(th),
          hasThreat: false, threatCount: 0, opportunity: null, exit: null,
        });
      }
    });
    const nodeById = Object.fromEntries(nodes.map((n) => [n.id, n]));

    const edges = [];
    const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
    SECTORS.forEach((s) => {
      const local = nodes.filter((n) => n.sectorId === s.id);
      const pairs = [];
      for (let i = 0; i < local.length; i++) for (let j = i + 1; j < local.length; j++) pairs.push([local[i], local[j], dist2(local[i], local[j])]);
      pairs.sort((a, b) => a[2] - b[2]);
      const deg = {};
      let added = 0;
      for (const [a, b] of pairs) {
        if (added >= local.length + 5) break;
        deg[a.id] = deg[a.id] || 0; deg[b.id] = deg[b.id] || 0;
        if (deg[a.id] >= 3 || deg[b.id] >= 3) continue;
        edges.push({ id: `e_${a.id}_${b.id}`, from: a.id, to: b.id, special: false });
        deg[a.id]++; deg[b.id]++; added++;
      }
    });
    // cross-sector links (ring-adjacent), some locked/special
    SECTORS.forEach((s, i) => {
      const next = SECTORS[(i + 1) % SECTORS.length];
      const a = nodes.filter((n) => n.sectorId === s.id).sort((p, q) => dist2(p, next) - dist2(q, next))[0];
      const b = nodes.filter((n) => n.sectorId === next.id).sort((p, q) => dist2(p, s) - dist2(q, s))[0];
      const kind = rnd() < 0.55 ? 'blocked' : 'electronic';
      edges.push({ id: `x_${s.id}_${next.id}`, from: a.id, to: b.id, special: true, feature: kind, opened: rnd() < 0.15 });
    });
    // two long-range shortcuts
    [[1, 4], [3, 6]].forEach(([i, j], k) => {
      const s1 = SECTORS[i], s2 = SECTORS[j];
      const a = nodes.filter((n) => n.sectorId === s1.id)[3 + k];
      const b = nodes.filter((n) => n.sectorId === s2.id)[3 + k];
      edges.push({ id: `lr_${k}`, from: a.id, to: b.id, special: true, feature: 'electronic', opened: false });
    });

    const adj = {};
    edges.forEach((e) => { (adj[e.from] ||= []).push(e); (adj[e.to] ||= []).push(e); });
    const neighborsOf = (id) => (adj[id] || []).map((e) => (e.from === id ? e.to : e.from));

    // exits
    const setExit = (sectorId, kind, status, offset) => {
      const cand = nodes.filter((n) => n.sectorId === sectorId);
      const n = cand[Math.min(offset, cand.length - 1)];
      n.exit = { kind, status };
    };
    setExit('power', 'A', 'closed', 2);
    setExit('comms', 'B', 'opening', 5);
    setExit('residential', 'key', 'closed', 9);

    // opportunities
    nodes.forEach((n) => { if (!n.exit && rnd() < 0.18) n.opportunity = { usesRemaining: 1 + Math.floor(rnd() * 3) }; });

    // threats (skip entrance)
    nodes.forEach((n) => {
      if (n.sectorId === 'entrance' || n.exit) return;
      if (rnd() < 0.16) { n.hasThreat = true; n.threatCount = 1 + Math.floor(rnd() * 3); }
    });

    /* ---------------- run state ---------------- */
    const startNode = nodes.filter((n) => n.sectorId === 'entrance').sort((a, b) => dist2(a, CENTER) - dist2(b, CENTER))[0];
    const state = {
      currentId: startNode.id,
      observed: new Set(),
      observedSnap: {},
      selectedId: null,
      view: { x: 0, y: 0, scale: 1 },
      time: 2140, timeMax: 14000,
      hp: 18, hpMax: 25,
      overload: 53, overloadFloor: 22,
      inv: 7, invCap: 9, burden: 2,
      caps: { perception: 1, stealth: 2, hacking: 0, mobility: 1, force: -1, deception: 0 },
      keyDiscovered: true,
      log: ['런 시작 — 입구·관리동 진입', '기본 정찰 (시간 +80)', '실험동 방향 이동'],
      expandedCap: null,
    };
    const CAP_LABEL = { perception: 'Perception', stealth: 'Stealth', hacking: 'Hacking', mobility: 'Mobility', force: 'Force', deception: 'Deception' };
    const CAP_SHORT = { perception: 'P', stealth: 'S', hacking: 'H', mobility: 'M', force: 'F', deception: 'D' };
    const CAP_DESC = {
      perception: '주변 정보 파악(정찰 해상도). 높을수록 위협 구성·다음 이동까지 보입니다.',
      stealth: '은신/소음 억제. 우회·기습 판정의 여유치에 더해집니다.',
      hacking: '전자 장치·탈출구 제어. 1 이상이면 electronic 특수 엣지를 열 수 있습니다.',
      mobility: '이동·회피. 2 이상이면 전투 중 이탈 진행도 즉시 +1.',
      force: '물리적 장애물 돌파. 1 이상이면 blocked 특수 엣지를 열 수 있습니다.',
      deception: '기만·위장. 가짜 소음원으로 수색을 유도합니다.',
    };

    const snapshotObservation = (id) => {
      const n = nodeById[id];
      state.observed.add(id);
      state.observedSnap[id] = { hasThreat: n.hasThreat, threatCount: n.threatCount, t: state.time };
    };
    const refreshObservations = () => { snapshotObservation(state.currentId); neighborsOf(state.currentId).forEach(snapshotObservation); };
    refreshObservations();

    const knowledgeOf = (id) => {
      if (id === state.currentId) return 'current';
      if (neighborsOf(state.currentId).includes(id)) return 'fresh';
      if (state.observed.has(id)) return 'stale';
      return 'unknown';
    };

    const toast = (msg) => {
      const el = document.getElementById('toast');
      el.textContent = msg; el.classList.add('show');
      clearTimeout(this._toastT);
      this._toastT = setTimeout(() => el.classList.remove('show'), 2200);
    };
    const pushLog = (line) => { state.log.push(line); if (state.log.length > 40) state.log.shift(); renderLog(); };

    /* ---------------- HUD ---------------- */
    const hudStats = document.getElementById('hudStats');
    const renderHud = () => {
      const overloadPct = Math.min(100, state.overload);
      const floorPct = Math.min(100, state.overloadFloor);
      hudStats.innerHTML = `
        <div class="stat-chip">${svgIcon('heart', 16)}<span class="lbl">HP</span><span class="val ${state.hp <= state.hpMax * 0.3 ? 'warn' : ''}">${state.hp}/${state.hpMax}</span></div>
        <div class="stat-chip">${svgIcon('clock', 16)}<span class="lbl">시간</span><span class="val ${state.time > state.timeMax * 0.85 ? 'warn' : ''}">${state.time.toLocaleString()}/${state.timeMax.toLocaleString()}</span></div>
        <div class="stat-chip">${svgIcon('bolt', 16)}<span class="lbl">과부화</span><div class="mini-bar"><div class="floor" style="left:${floorPct}%"></div><i style="width:${overloadPct}%"></i></div><span class="val ${overloadPct >= 80 ? 'warn' : ''}">${state.overload}</span></div>
        <div class="stat-chip">${svgIcon('box', 16)}<span class="lbl">인벤토리</span><span class="val ${state.burden > 0 ? 'warn' : ''}">${state.inv}/${state.invCap}${state.burden ? ` (짐 ${state.burden})` : ''}</span></div>
      `;
    };

    /* ---------------- sector + capability panel ---------------- */
    const secSector = document.getElementById('secSector');
    const capGrid = document.getElementById('capGrid');
    const renderSector = () => {
      const cur = nodeById[state.currentId];
      const s = sectorById[cur.sectorId];
      const dots = [0, 1, 2].map((i) => `<i class="${i < s.alert ? 'on' : ''}"></i>`).join('');
      const exitChip = (label, exit) => {
        if (!exit) return `<div class="exit-chip">${label} <span style="color:var(--color-neutral-500)">비보유</span></div>`;
        return `<div class="exit-chip ${exit.status === 'open' ? 'open' : ''}">${svgIcon(exit.kind === 'key' ? 'key' : 'diamond', 12)} ${label} <span style="color:var(--color-neutral-600)">${statusLabel(exit.status)}</span></div>`;
      };
      const A = nodes.find((n) => n.exit && n.exit.kind === 'A').exit;
      const B = nodes.find((n) => n.exit && n.exit.kind === 'B').exit;
      const K = state.keyDiscovered ? nodes.find((n) => n.exit && n.exit.kind === 'key').exit : null;
      secSector.innerHTML = `
        <h4>현재 위치</h4>
        <div class="sector-head"><span class="name">${s.name}</span><div class="alert-dots" title="구역 경계도 ${s.alert}/3">${dots}</div></div>
        <div style="font-size:10.5px;color:var(--color-neutral-600);margin-top:2px;">경계도 ${s.alert}/3 — 소음/가짜 목표 오인 시 상승, 자연 하락 없음</div>
        <div class="exit-row">
          ${exitChip('A', A)}
          ${exitChip('B', B)}
          ${state.keyDiscovered ? exitChip('열쇠', K) : `<div class="exit-chip">${svgIcon('key', 12)} 열쇠 <span style="color:var(--color-neutral-500)">미발견</span></div>`}
        </div>
      `;
    };
    const statusLabel = (s) => ({ closed: '닫힘', requesting: '요청 중', opening: '개방 대기', open: '열림', disabled: '비활성' }[s] || s);

    const renderCaps = () => {
      capGrid.innerHTML = Object.keys(CAP_LABEL).map((k) => {
        const v = state.caps[k];
        const expanded = state.expandedCap === k;
        return `<div class="cap-chip ${expanded ? 'expanded' : ''}" data-cap="${k}">
          <div class="top"><span class="k">${CAP_SHORT[k]} · ${CAP_LABEL[k]}</span><span class="v">${v >= 0 ? '+' : ''}${v}</span></div>
          <div class="desc">${CAP_DESC[k]}</div>
        </div>`;
      }).join('');
      capGrid.querySelectorAll('.cap-chip').forEach((el) => {
        el.addEventListener('click', () => {
          const k = el.getAttribute('data-cap');
          state.expandedCap = state.expandedCap === k ? null : k;
          renderCaps();
        });
      });
    };

    /* ---------------- inspector / action panel ---------------- */
    const inspector = document.getElementById('inspector');
    const renderInspector = () => {
      const id = state.selectedId || state.currentId;
      const n = nodeById[id];
      const know = knowledgeOf(id);
      const isCurrent = id === state.currentId;
      const sector = sectorById[n.sectorId];
      const knowLabel = { current: '현재 위치', fresh: '시야 안 · 실시간', stale: '마지막 확인 정보', unknown: '미확인' }[know];
      const knowColor = { current: 'var(--color-accent-2-700)', fresh: 'var(--color-text)', stale: 'var(--color-neutral-600)', unknown: 'var(--color-neutral-500)' }[know];

      let html = `<div class="insp-title">${sector.name} · ${n.id.split('_')[1] ? '노드 ' + n.id.split('_')[1] : n.id}</div>`;
      html += `<div class="know-badge" style="color:${knowColor}">${knowLabel}</div>`;

      if (know === 'unknown') {
        html += `<div class="insp-sub">아직 관측된 적 없는 구역입니다. 인접 위치까지 이동하면 존재만 확인됩니다.</div>`;
        inspector.innerHTML = html;
        return;
      }

      if (know === 'stale') {
        const snap = state.observedSnap[id];
        const ago = snap ? state.time - snap.t : null;
        html += `<div class="stale-note">마지막 관측: ${ago != null ? ago + '포인트 전' : '알 수 없음'} — 그 사이 상황이 바뀌었을 수 있습니다.</div>`;
      }

      const threatKnown = know === 'current' || know === 'fresh';
      const hasThreatNow = threatKnown ? n.hasThreat : (state.observedSnap[id] ? state.observedSnap[id].hasThreat : false);
      const cntNow = threatKnown ? n.threatCount : null;

      if (hasThreatNow) {
        const canResolveComposition = state.caps.perception >= 2;
        html += `<div class="threat-flow">
          <div class="h">${svgIcon('warn', 14, 'var(--color-accent-700)')} 위협 포착${threatKnown && cntNow ? ` — ${canResolveComposition ? cntNow + '개 그룹 확인' : '다수 추정(구성 불명)'}` : ' (시야 밖 · 그룹 수 불명)'}</div>
          <div style="font-size:10.5px;color:var(--color-neutral-700);margin-bottom:8px;">${canResolveComposition ? 'Perception ' + state.caps.perception + ' — 구성까지 파악됨.' : 'Perception이 낮아 존재만 확인됩니다. 2 이상이면 구성까지 보입니다.'}</div>
        </div>`;
        if (isCurrent === false && know === 'fresh') {
          const marginStealth = state.caps.stealth - 1;
          html += `<div class="action-group"><div class="label">교전 대응</div>
            <button class="action-btn" data-act="bypass" data-id="${id}"><div class="t">우회<span>${marginStealth >= 0 ? '가능' : '위험'}</span></div><div class="preview">은신 여유 = Stealth ${state.caps.stealth} - 위협 경계 1 = ${marginStealth} · 소음 낮음</div></button>
            <button class="action-btn" data-act="ambush" data-id="${id}"><div class="t">선제 기습<span>${marginStealth >= 1 ? '가능' : '발각 위험'}</span></div><div class="preview">성공 시 스턴 부여 · 실패 시 즉시 교전</div></button>
            <button class="action-btn danger-flow" data-act="engage" data-id="${id}"><div class="t">정면 진입<span>교전 확정</span></div><div class="preview">시간 손실 없음 · 소음 큼 · 전투 화면으로 전환</div></button>
          </div>`;
        }
      }

      if (n.opportunity && n.opportunity.usesRemaining > 0 && isCurrent) {
        html += `<div class="action-group"><div class="label">현장 기회</div>
          <button class="action-btn" data-act="farm" data-id="${id}"><div class="t">현장 파밍<span>${n.opportunity.usesRemaining}회 남음</span></div><div class="preview">시간 +90 · 소음 낮음 · 안전/신속/강행 비교 가능</div></button>
        </div>`;
      }

      if (isCurrent) {
        html += `<div class="action-group"><div class="label">정찰</div>
          <button class="action-btn" data-act="recon"><div class="t">기본 정찰<span>항상 성공</span></div><div class="preview">시간 +80 · 소음 없음 · 인접 위협 유무만 갱신</div></button>
        </div>`;

        const lockedHere = edges.filter((e) => (e.from === id || e.to === id) && e.special && !e.opened);
        if (lockedHere.length) {
          html += `<div class="action-group"><div class="label">환경 조작</div>`;
          lockedHere.forEach((e) => {
            const otherId = e.from === id ? e.to : e.from;
            const kind = e.feature === 'electronic' ? 'hacking' : 'force';
            const cap = state.caps[kind];
            const ok = cap >= 1;
            html += `<button class="action-btn" data-act="openEdge" data-edge="${e.id}" ${ok ? '' : 'disabled'}>
              <div class="t">특수 엣지 개방 (${e.feature === 'electronic' ? 'Hacking' : 'Force'})<span>${sectorById[nodeById[otherId].sectorId].name} 방향</span></div>
              <div class="preview">${ok ? `${CAP_LABEL[kind]} ${cap} 충분 · 소음 발생 · 과부화 +5` : `${CAP_LABEL[kind]} 1 이상 필요 (현재 ${cap})`}</div>
            </button>`;
          });
          html += `</div>`;
        }

        html += `<div class="action-group"><div class="label">현장 장비</div>
          <button class="action-btn" data-act="arm-scan"><div class="t">원격 정찰 사용<span>사거리 3</span></div><div class="preview">대상 노드 지정 → 정보만 갱신 · 이동 없음 · 재사용 대기 발생</div></button>
        </div>`;

        if (n.exit) {
          const ex = n.exit;
          if (ex.status === 'closed') {
            html += `<div class="action-group"><div class="label">탈출구</div>
              <button class="action-btn primary" data-act="reqExit"><div class="t">탈출구 ${ex.kind === 'key' ? '열쇠' : ex.kind} 개방 요청<span>확인 필요</span></div><div class="preview">Hacking ${state.caps.hacking} — 클수록 대기 시간 단축 · 되돌릴 수 없음</div></button>
            </div>`;
          } else if (ex.status === 'opening') {
            html += `<div class="action-group"><div class="label">탈출구</div><div style="font-size:11px;color:var(--color-neutral-700);">개방 대기 중 — 곧 열립니다. 열리면 다음 행동 종료 즉시 자동 탈출.</div></div>`;
          } else if (ex.status === 'open') {
            html += `<div class="action-group"><div class="label">탈출구</div><div style="font-size:11px;color:var(--color-accent-700);font-weight:800;">지금 열려 있습니다 — 아무 행동이나 하면 즉시 탈출!</div></div>`;
          }
        }
      } else if (know === 'fresh' && !hasThreatNow) {
        const blockedEdge = edges.find((e) => ((e.from === state.currentId && e.to === id) || (e.to === state.currentId && e.from === id)) && e.special && !e.opened);
        html += `<div class="action-group"><div class="label">이동</div>`;
        if (blockedEdge) {
          html += `<button class="action-btn" disabled><div class="t">이동<span>잠김</span></div><div class="preview">이 통로는 ${blockedEdge.feature === 'electronic' ? 'Hacking' : 'Force'}으로 열어야 지나갈 수 있습니다.</div></button>`;
        } else {
          html += `<button class="action-btn primary" data-act="move" data-id="${id}"><div class="t">이동<span>인접</span></div><div class="preview">시간 +${100 + Math.floor(rnd() * 80)} · 이동 소음 낮음</div></button>`;
        }
        html += `</div>`;
      }

      inspector.innerHTML = html;
      inspector.querySelectorAll('[data-act]').forEach((el) => el.addEventListener('click', () => handleAction(el.getAttribute('data-act'), el)));
    };

    /* ---------------- actions ---------------- */
    const moveTo = (id) => {
      state.currentId = id;
      state.time += 100 + Math.floor(rnd() * 80);
      state.selectedId = null;
      refreshObservations();
      pushLog(`이동 → ${sectorById[nodeById[id].sectorId].name}`);
      renderAll();
      focusOn(id, 1.15);
    };

    let scanArmed = false;
    const handleAction = (act, el) => {
      if (act === 'recon') { refreshObservations(); state.time += 80; toast('기본 정찰 완료 — 인접 위협 정보 갱신'); pushLog('기본 정찰 (시간 +80)'); renderAll(); return; }
      if (act === 'move') { moveTo(el.getAttribute('data-id')); return; }
      if (act === 'farm') {
        const n = nodeById[el.getAttribute('data-id')];
        n.opportunity.usesRemaining -= 1; state.time += 90; state.inv = Math.min(state.invCap, state.inv + 1);
        toast('현장 파밍 완료 — 소지품 +1'); pushLog('현장 파밍 (시간 +90)');
        renderAll(); return;
      }
      if (act === 'openEdge') {
        const e = edges.find((x) => x.id === el.getAttribute('data-edge'));
        e.opened = true; state.overload = Math.min(100, state.overload + 5);
        toast('특수 엣지 개방됨'); pushLog('특수 엣지 개방'); renderAll(); return;
      }
      if (act === 'arm-scan') {
        scanArmed = !scanArmed;
        toast(scanArmed ? '대상 노드를 지도에서 클릭하세요 (사거리 3)' : '원격 정찰 취소');
        drawMap(); return;
      }
      if (act === 'bypass') { toast('우회 성공 — 위협을 피해 이동'); pushLog('우회 이동'); moveTo(el.getAttribute('data-id')); return; }
      if (act === 'ambush') { toast('선제 기습 — 스턴 부여, 전투 진입'); pushLog('선제 기습 → 전투 진입'); return; }
      if (act === 'engage') { toast('정면 진입 — 전투 화면으로 전환'); pushLog('정면 진입 → 전투 진입'); return; }
      if (act === 'reqExit') {
        openConfirm('탈출구 개방 요청', '요청 후에는 취소할 수 없습니다. 개방까지 Hacking 수치에 따라 대기 시간이 걸리며, 열리면 다음 행동 종료 즉시 자동으로 탈출합니다.', () => {
          const n = nodeById[state.currentId]; n.exit.status = 'opening';
          toast('탈출구 개방 요청됨'); pushLog('탈출구 개방 요청'); renderAll();
        });
        return;
      }
    };

    const openConfirm = (title, body, onOk) => {
      document.getElementById('cfTitle').textContent = title;
      document.getElementById('cfBody').textContent = body;
      const modal = document.getElementById('confirmModal');
      modal.classList.add('open');
      const ok = document.getElementById('cfOk'); const cancel = document.getElementById('cfCancel');
      const cleanup = () => { modal.classList.remove('open'); ok.onclick = null; cancel.onclick = null; };
      ok.onclick = () => { cleanup(); onOk(); };
      cancel.onclick = cleanup;
    };

    /* ---------------- log drawer ---------------- */
    const logBody = document.getElementById('logBody');
    const renderLog = () => { logBody.innerHTML = state.log.slice().reverse().map((l) => `<div>· ${l}</div>`).join(''); };

    /* ---------------- legend popover ---------------- */
    const legendPop = document.getElementById('legendPop');
    const LEGEND = [
      ['current', '현재 위치'], ['fresh', '시야 안 · 안전'], ['fresh-threat', '시야 안 · 위협'],
      ['stale', '시야 밖 · 마지막 확인'], ['unknown', '미확인'], ['exit', '탈출구 (A/B/열쇠)'],
      ['locked', '미개방 특수 엣지'], ['opportunity', '현장 기회'],
    ];
    const legendGlyph = (k) => {
      if (k === 'exit') return `<svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1 15 8 8 15 1 8Z" fill="var(--color-accent)"/></svg>`;
      if (k === 'locked') return `<svg width="16" height="16" viewBox="0 0 16 16"><line x1="1" y1="8" x2="15" y2="8" stroke="var(--color-accent-2-700)" stroke-width="2" stroke-dasharray="3 2"/></svg>`;
      if (k === 'opportunity') return `<svg width="16" height="16" viewBox="0 0 16 16">${ICON.leaf.replace(/20/g, '16')}</svg>`.replace('stroke="currentColor"', 'stroke="var(--color-accent-2-700)"');
      const fillMap = { current: 'var(--color-accent-2-700)', fresh: 'var(--color-bg)', 'fresh-threat': 'var(--color-accent-600)', stale: 'var(--color-bg)', unknown: 'var(--color-neutral-300)' };
      const op = k === 'stale' ? '0.55' : '1';
      return `<svg width="16" height="16" viewBox="0 0 16 16" opacity="${op}"><circle cx="8" cy="8" r="6" fill="${fillMap[k]}" stroke="var(--color-divider)" stroke-width="1.4"/></svg>`;
    };
    legendPop.innerHTML = `<h5>범례</h5>` + LEGEND.map(([k, label]) => `<div class="legend-row"><span class="legend-glyph">${legendGlyph(k)}</span>${label}</div>`).join('');

    /* ---------------- map rendering ---------------- */
    const mapSvg = document.getElementById('mapSvg');
    const mapWrap = document.getElementById('mapWrap');
    const gRoot = document.createElementNS(NS, 'g'); mapSvg.appendChild(gRoot);
    const gZones = document.createElementNS(NS, 'g'); gRoot.appendChild(gZones);
    const gEdges = document.createElementNS(NS, 'g'); gRoot.appendChild(gEdges);
    const gNodes = document.createElementNS(NS, 'g'); gRoot.appendChild(gNodes);
    const gOffscreen = document.createElementNS(NS, 'g'); mapSvg.appendChild(gOffscreen);

    const applyTransform = () => {
      const { x, y, scale } = state.view;
      gRoot.setAttribute('transform', `translate(${x + 600},${y + 600}) scale(${scale}) translate(-600,-600)`);
    };

    const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v)); return e; };

    const drawZones = () => {
      gZones.innerHTML = '';
      SECTORS.forEach((s, i) => {
        const c = el('circle', { cx: s.cx, cy: s.cy, r: SECTOR_R + 42, fill: i % 2 === 0 ? 'var(--color-neutral-100)' : 'transparent', stroke: 'var(--color-divider)', 'stroke-width': 1, 'stroke-dasharray': '2 5', opacity: 0.7 });
        gZones.appendChild(c);
        const lx = CENTER.x + (RING_R + SECTOR_R + 70) * Math.cos(s.angle);
        const ly = CENTER.y + (RING_R + SECTOR_R + 70) * Math.sin(s.angle);
        const t = el('text', { x: lx, y: ly, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 800, fill: s.id === sectorById[nodeById[state.currentId].sectorId].id ? 'var(--color-accent-700)' : 'var(--color-neutral-700)', 'letter-spacing': '0.02em' });
        t.textContent = s.name; gZones.appendChild(t);
        for (let d = 0; d < 3; d++) {
          const dx = lx - 30 + d * 12, dy = ly + 16;
          gZones.appendChild(el('circle', { cx: dx, cy: dy, r: 3, fill: d < s.alert ? 'var(--color-accent-600)' : 'var(--color-neutral-300)' }));
        }
      });
    };

    let hoveredId = null;
    const drawEdges = () => {
      gEdges.innerHTML = '';
      edges.forEach((e) => {
        const a = nodeById[e.from], b = nodeById[e.to];
        const ka = knowledgeOf(e.from), kb = knowledgeOf(e.to);
        if (ka === 'unknown' && kb === 'unknown') return;
        const isCurrentAdj = e.from === state.currentId || e.to === state.currentId;
        const highlighted = hoveredId && (e.from === hoveredId || e.to === hoveredId) && (hoveredId === state.currentId || isCurrentAdj);
        let stroke = 'var(--color-neutral-400)', width = 1.4, dash = null;
        if (e.special) { stroke = e.opened ? 'var(--color-accent-2-700)' : 'var(--color-accent-2-700)'; width = e.opened ? 2 : 2.4; dash = e.opened ? null : '5 3'; }
        if (scanArmed && isCurrentAdj) stroke = 'var(--color-accent)';
        if (highlighted) {
          gEdges.appendChild(el('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: 'var(--color-accent-2-300)', 'stroke-width': 8, opacity: 0.6 }));
        }
        const line = el('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke, 'stroke-width': width });
        if (dash) line.setAttribute('stroke-dasharray', dash);
        gEdges.appendChild(line);
        const hit = el('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: 'transparent', 'stroke-width': 14, style: 'cursor:pointer' });
        hit.addEventListener('mouseenter', () => { hoveredId = e.from === state.currentId ? e.to : e.from; drawEdges(); });
        hit.addEventListener('mouseleave', () => { hoveredId = null; drawEdges(); });
        if (isCurrentAdj && e.special && !e.opened) {
          hit.addEventListener('click', () => handleAction('openEdge', { getAttribute: () => e.id }));
        }
        gEdges.appendChild(hit);
      });
    };

    const drawNodes = () => {
      gNodes.innerHTML = '';
      nodes.forEach((n) => {
        const know = knowledgeOf(n.id);
        if (know === 'unknown' && !n.exit) return;
        const isCurrent = know === 'current';
        const g = el('g', { style: 'cursor:pointer' });
        const opacity = know === 'stale' ? 0.5 : know === 'unknown' ? 0.6 : 1;

        const inScanRange = scanArmed && (() => {
          const seen = new Set([state.currentId]); let frontier = [state.currentId];
          for (let h = 0; h < 3; h++) { const nx = []; frontier.forEach((f) => neighborsOf(f).forEach((m) => { if (!seen.has(m)) { seen.add(m); nx.push(m); } })); frontier = nx; }
          return seen.has(n.id) && n.id !== state.currentId;
        })();

        if (n.exit) {
          const size = 13;
          const pts = `${n.x},${n.y - size} ${n.x + size},${n.y} ${n.x},${n.y + size} ${n.x - size},${n.y}`;
          g.appendChild(el('polygon', { points: pts, fill: n.exit.status === 'open' ? 'var(--color-accent)' : 'var(--color-neutral-900)', stroke: 'var(--color-accent)', 'stroke-width': 2, opacity }));
          const t = el('text', { x: n.x, y: n.y + 4, 'text-anchor': 'middle', 'font-size': 10, 'font-weight': 800, fill: 'var(--color-bg)', opacity });
          t.textContent = n.exit.kind === 'key' ? 'K' : n.exit.kind; g.appendChild(t);
        } else if (isCurrent) {
          g.appendChild(el('circle', { cx: n.x, cy: n.y, r: 11, fill: 'none', stroke: 'var(--color-accent-2-700)', 'stroke-width': 2, class: 'glow' }));
          g.appendChild(el('circle', { cx: n.x, cy: n.y, r: 8, fill: 'var(--color-accent-2-700)', stroke: 'var(--color-bg)', 'stroke-width': 1.5 }));
        } else {
          const fill = know === 'fresh' && n.hasThreat ? 'var(--color-accent-600)' : know === 'stale' && state.observedSnap[n.id]?.hasThreat ? 'var(--color-accent-600)' : know === 'unknown' ? 'var(--color-neutral-300)' : 'var(--color-bg)';
          const r = inScanRange ? 8 : 6;
          g.appendChild(el('circle', { cx: n.x, cy: n.y, r, fill, stroke: inScanRange ? 'var(--color-accent)' : 'var(--color-divider)', 'stroke-width': inScanRange ? 2 : 1.3, opacity }));
        }

        if (n.opportunity && n.opportunity.usesRemaining > 0 && know !== 'unknown') {
          g.appendChild(el('circle', { cx: n.x + 9, cy: n.y - 9, r: 4.2, fill: 'var(--color-accent-2-700)', opacity }));
        }
        const showThreatBadge = (know === 'fresh' && n.hasThreat) || (know === 'stale' && state.observedSnap[n.id]?.hasThreat) || (know === 'current' && n.hasThreat);
        if (showThreatBadge && !n.exit) {
          const t = el('text', { x: n.x, y: n.y - 14, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--color-accent-700)', opacity });
          t.textContent = know === 'fresh' || know === 'current' ? `▲${n.threatCount}` : '▲';
          g.appendChild(t);
        }

        const hitR = el('circle', { cx: n.x, cy: n.y, r: 16, fill: 'transparent' });
        g.appendChild(hitR);
        g.addEventListener('click', () => {
          if (scanArmed && inScanRange) { snapshotObservation(n.id); scanArmed = false; toast('원격 정찰 — 대상 정보 갱신됨'); pushLog('원격 정찰 사용'); state.selectedId = n.id; renderAll(); return; }
          state.selectedId = n.id; renderInspector();
        });
        g.addEventListener('mouseenter', () => { hoveredId = n.id; drawEdges(); });
        g.addEventListener('mouseleave', () => { hoveredId = null; drawEdges(); });
        gNodes.appendChild(g);
      });
    };

    const drawOffscreenIndicators = () => {
      gOffscreen.innerHTML = '';
      const wrapRect = mapWrap.getBoundingClientRect();
      if (!wrapRect.width) return;
      const vb = mapSvg.viewBox.baseVal;
      const toScreen = (px, py) => {
        const { x, y, scale } = state.view;
        const gx = (px - 600) * scale + 600 + x;
        const gy = (py - 600) * scale + 600 + y;
        return { sx: gx / vb.width * wrapRect.width, sy: gy / vb.height * wrapRect.height };
      };
      const exits = nodes.filter((n) => n.exit && (n.exit.kind !== 'key' || state.keyDiscovered));
      exits.forEach((n) => {
        const { sx, sy } = toScreen(n.x, n.y);
        const margin = 46;
        if (sx >= margin && sx <= wrapRect.width - margin && sy >= margin && sy <= wrapRect.height - margin) return;
        const cx = wrapRect.width / 2, cy = wrapRect.height / 2;
        const dx = sx - cx, dy = sy - cy;
        const angle = Math.atan2(dy, dx);
        const ex = Math.max(margin, Math.min(wrapRect.width - margin, cx + Math.cos(angle) * (cx - margin)));
        const ey = Math.max(margin, Math.min(wrapRect.height - margin, cy + Math.sin(angle) * (cy - margin)));
        const px = ex / wrapRect.width * vb.width, py = ey / wrapRect.height * vb.height;
        const g = el('g', {});
        const rot = angle * 180 / Math.PI;
        const arrow = el('polygon', { points: '0,-9 12,0 0,9', fill: 'var(--color-accent)', transform: `translate(${px},${py}) rotate(${rot})` });
        g.appendChild(arrow);
        const label = el('text', { x: px, y: py + (dy < 0 ? -16 : 24), 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 800, fill: 'var(--color-accent-700)' });
        label.textContent = n.exit.kind === 'key' ? '열쇠' : n.exit.kind;
        g.appendChild(label);
        gOffscreen.appendChild(g);
      });
    };

    const drawMap = () => { drawZones(); drawEdges(); drawNodes(); applyTransform(); drawOffscreenIndicators(); };

    /* ---------------- minimap ---------------- */
    const miniSvg = document.getElementById('miniSvg');
    const drawMinimap = () => {
      miniSvg.innerHTML = '';
      SECTORS.forEach((s) => miniSvg.appendChild(el('circle', { cx: s.cx, cy: s.cy, r: SECTOR_R + 30, fill: 'var(--color-neutral-100)', stroke: 'var(--color-divider)', 'stroke-width': 2 })));
      edges.forEach((e) => { const a = nodeById[e.from], b = nodeById[e.to]; miniSvg.appendChild(el('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: 'var(--color-neutral-400)', 'stroke-width': 1.5 })); });
      nodes.forEach((n) => {
        if (n.exit) { miniSvg.appendChild(el('circle', { cx: n.x, cy: n.y, r: 9, fill: 'var(--color-accent)' })); return; }
        const isCurrent = n.id === state.currentId;
        miniSvg.appendChild(el('circle', { cx: n.x, cy: n.y, r: isCurrent ? 12 : 5, fill: isCurrent ? 'var(--color-accent-2-700)' : 'var(--color-neutral-400)' }));
      });
      const rect = el('rect', { id: 'viewportRect', x: 0, y: 0, width: 1200, height: 1200, fill: 'none', stroke: 'var(--color-accent)', 'stroke-width': 6 });
      miniSvg.appendChild(rect);
      updateViewportRect();
      miniSvg.onclick = (ev) => {
        const bounds = miniSvg.getBoundingClientRect();
        const px = (ev.clientX - bounds.left) / bounds.width * 1200;
        const py = (ev.clientY - bounds.top) / bounds.height * 1200;
        state.view.x = -(px - 600) * state.view.scale;
        state.view.y = -(py - 600) * state.view.scale;
        drawMap(); updateViewportRect();
      };
    };
    const updateViewportRect = () => {
      const rect = document.getElementById('viewportRect');
      if (!rect) return;
      const { x, y, scale } = state.view;
      const w = 1200 / scale, h = 1200 / scale;
      const cx = 600 - x / scale, cy = 600 - y / scale;
      rect.setAttribute('x', cx - w / 2); rect.setAttribute('y', cy - h / 2);
      rect.setAttribute('width', w); rect.setAttribute('height', h);
    };

    /* ---------------- pan / zoom ---------------- */
    let dragging = false, lastX = 0, lastY = 0, moved = false;
    mapWrap.addEventListener('mousedown', (ev) => { dragging = true; moved = false; lastX = ev.clientX; lastY = ev.clientY; mapWrap.classList.add('dragging'); });
    window.addEventListener('mousemove', (ev) => {
      if (!dragging) return;
      const dx = ev.clientX - lastX, dy = ev.clientY - lastY;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
      lastX = ev.clientX; lastY = ev.clientY;
      state.view.x += dx; state.view.y += dy;
      applyTransform(); updateViewportRect(); drawOffscreenIndicators();
    });
    window.addEventListener('mouseup', () => { dragging = false; mapWrap.classList.remove('dragging'); });
    mapWrap.addEventListener('wheel', (ev) => { ev.preventDefault(); zoomBy(ev.deltaY < 0 ? 1.12 : 1 / 1.12); }, { passive: false });
    const zoomBy = (f) => { state.view.scale = Math.max(0.45, Math.min(3, state.view.scale * f)); applyTransform(); updateViewportRect(); drawOffscreenIndicators(); };
    document.getElementById('btnZoomIn').innerHTML = svgIcon('plus', 16);
    document.getElementById('btnZoomOut').innerHTML = svgIcon('minus', 16);
    document.getElementById('btnLocate').innerHTML = svgIcon('target', 16);
    document.getElementById('btnZoomIn').addEventListener('click', () => zoomBy(1.25));
    document.getElementById('btnZoomOut').addEventListener('click', () => zoomBy(1 / 1.25));
    const focusOn = (id, scale) => {
      const n = nodeById[id];
      state.view.scale = scale || state.view.scale;
      state.view.x = -(n.x - 600) * state.view.scale;
      state.view.y = -(n.y - 600) * state.view.scale;
      applyTransform(); updateViewportRect(); drawOffscreenIndicators();
    };
    document.getElementById('btnLocate').addEventListener('click', () => focusOn(state.currentId, 1.2));

    /* ---------------- top-level HUD buttons ---------------- */
    document.getElementById('btnLegend').innerHTML = `<span style="font-family:var(--font-heading);font-weight:800;font-size:13px;">?</span>`;
    document.getElementById('btnLog').innerHTML = svgIcon('list', 16);
    document.getElementById('btnLegend').addEventListener('click', () => { legendPop.classList.toggle('open'); });
    document.addEventListener('click', (ev) => {
      if (!legendPop.contains(ev.target) && ev.target.id !== 'btnLegend') legendPop.classList.remove('open');
    });
    const logDrawer = document.getElementById('logDrawer');
    document.getElementById('btnLog').addEventListener('click', () => { logDrawer.classList.toggle('open'); document.getElementById('btnLog').classList.toggle('on'); });
    document.getElementById('btnInventory').addEventListener('click', () => toast('인벤토리 / 장비교체 패널 (별도 화면)'));

    /* ---------------- render orchestration ---------------- */
    const renderAll = () => { renderHud(); renderSector(); renderCaps(); renderInspector(); drawMap(); drawMinimap(); renderLog(); };
    renderAll();
    focusOn(state.currentId, 1.1);
    window.addEventListener('resize', () => { drawOffscreenIndicators(); });
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
